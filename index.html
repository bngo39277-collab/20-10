<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>20/10 - A1K16</title>
<!--
  HƯỚNG DẪN NHANH
  1) Lưu file này thành index.html, mở bằng Chrome/Edge/Safari (cần Internet lần đầu để tải Three.js và font).
  2) Nhạc: đặt file music.mp3 cùng thư mục với index.html, rồi bấm nút 🎵 (trình duyệt không cho tự phát).
     Không có music.mp3 thì trang vẫn chạy bình thường; có thể bấm "Chọn MP3" để chọn file khác.
  3) Nội dung (chữ, ảnh, sticker, cài đặt) tự lưu trong trình duyệt; dùng "Xuất / Nhập" để sao lưu thành file .json.
-->
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300;400;500;700&family=Be+Vietnam+Pro:wght@300;400;500;700&family=Nunito:wght@300;400;500;700&family=Baloo+2:wght@500;800&family=Dancing+Script:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--teal:#6fe3d2;--pink:#ff8fb1;--ink:#e9f3ff}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;color:var(--ink);font:500 14px 'Baloo 2','Fredoka',system-ui,sans-serif;background:#000}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#c:active{cursor:grabbing}
button,input,select,textarea{font:inherit;color:inherit}
button{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.16);border-radius:999px;padding:7px 12px;cursor:pointer;transition:.15s}
button:hover{background:linear-gradient(120deg,rgba(111,227,210,.35),rgba(255,143,177,.35));transform:translateY(-1px)}
button:active,label.btn:active{transform:scale(.95)}
label.btn{display:flex;align-items:center;justify-content:center;margin:0;padding:7px 12px;font-size:14px;opacity:1;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.16);border-radius:999px;cursor:pointer;transition:.15s;text-align:center}
label.btn:hover{background:linear-gradient(120deg,rgba(111,227,210,.35),rgba(255,143,177,.35));transform:translateY(-1px)}
#ed label.btn{margin-top:8px}
.fi{position:fixed;left:-9999px;top:0;width:1px;height:1px;opacity:0}
:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
#panel{position:fixed;top:12px;right:12px;bottom:12px;width:min(340px,92vw);overflow:auto;padding:14px;border-radius:22px;background:rgba(10,16,40,.74);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.12);box-shadow:0 20px 60px rgba(0,0,0,.5);transition:transform .35s}
.closed #panel{transform:translateX(115%)}
h1{margin:0 0 8px;font-size:20px;font-weight:800;background:linear-gradient(90deg,var(--teal),var(--pink));-webkit-background-clip:text;background-clip:text;color:transparent}
details{border-top:1px solid rgba(255,255,255,.1);padding:8px 0}
summary{cursor:pointer;font-weight:800;color:var(--teal);padding:2px 0}
label{display:grid;gap:3px;font-size:12px;opacity:.95;margin:7px 0}
.chk{display:flex;align-items:center;gap:6px}
.row{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0;align-items:end}
.row>*{flex:1}
input[type=range]{width:100%;accent-color:var(--pink)}
input[type=color]{width:100%;height:32px;padding:0;border:0;background:none}
input:not([type]),input[type=text],textarea,select{width:100%;background:rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.16);border-radius:10px;padding:6px 8px}
select option{color:#000}
.hint{opacity:.65;font-size:12px;margin:6px 0}
#list{list-style:none;margin:6px 0;padding:0;display:grid;gap:5px;max-height:170px;overflow:auto}
#list li{display:flex;align-items:center;gap:4px;padding:4px 6px 4px 10px;border-radius:12px;border:1px solid rgba(255,255,255,.1);cursor:pointer}
#list li.on{border-color:var(--pink);background:rgba(255,143,177,.14)}
#list span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#list button{padding:2px 8px}
#tog,#bar button,#exit{position:fixed;width:42px;height:42px;padding:0;border-radius:50%;background:rgba(10,16,40,.6);backdrop-filter:blur(8px);font-size:18px}
#tog{top:12px;right:12px;z-index:5}
.closed #tog{right:12px}
#panel~#tog{display:block}
body:not(.closed) #tog{right:min(364px,95vw)}
#bar{position:fixed;top:12px;left:12px;display:flex;gap:8px}
#bar button{position:static}
#exit{display:none;width:auto;border-radius:999px;padding:0 16px;bottom:16px;left:50%;transform:translateX(-50%);top:auto;height:38px;font-size:13px}
.pv #panel,.pv #tog,.pv #bar{display:none}
.pv #exit{display:block}
#toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,20px);background:rgba(10,16,40,.92);border:1px solid var(--pink);padding:9px 16px;border-radius:14px;opacity:0;pointer-events:none;transition:.3s;max-width:90vw;z-index:9}
#toast.on{opacity:1;transform:translate(-50%,0)}
@media(max-width:640px){#panel{top:auto;left:8px;right:8px;bottom:8px;width:auto;max-height:56vh}.closed #panel{transform:translateY(115%)}body:not(.closed) #tog{right:12px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<canvas id="c"></canvas>

<!-- Thanh nút nhanh: luôn hiện kể cả khi thu gọn bảng điều khiển -->
<div id="bar">
  <button id="auto" title="Tạm dừng / tiếp tục xoay">⏸</button>
  <button id="rst" title="Đặt lại góc xoay">⟲</button>
  <button id="intro" title="Phát lại hoạt ảnh rơi">🌠</button>
  <button id="fs" title="Toàn màn hình">⛶</button>
  <button id="pv" title="Xem trước (ẩn giao diện)">👁</button>
  <button id="bpp" title="Phát / dừng nhạc">🎵</button>
</div>
<button id="tog" title="Mở / thu gọn bảng điều khiển">☰</button>
<button id="exit">Thoát xem trước</button>

<aside id="panel">
  <h1>Không gian 3D</h1>
  <details open><summary>Thêm phần tử</summary>
    <div class="row"><label class="btn" for="fImg">🖼 Ảnh</label><label class="btn" for="fStk">🏷 Sticker</label><button id="aTxt">🔤 Chữ</button><button id="aHrt">💗 Tim 3D</button></div>
    <div class="row"><input id="emo" type="text" placeholder="Dán emoji, ví dụ 😍"><button id="aEmo">Thêm emoji</button></div>
  </details>
  <details open><summary>Danh sách</summary><ul id="list"></ul></details>
  <details open><summary>Chỉnh sửa phần tử đã chọn</summary><div id="ed"></div></details>
  <details id="scene"><summary>Cảnh &amp; chuyển động</summary>
    <label>Tốc độ xoay tự động<input type="range" data-s="speed" min="0" max="4" step="0.1"></label>
    <label>Tốc độ rơi (trên → dưới)<input type="range" data-s="fall" min="0" max="3" step="0.1"></label>
    <label>Kích thước không gian (bán kính)<input type="range" data-s="size" min="0.5" max="2" step="0.05"></label>
    <label>Mức phóng to (zoom)<input type="range" data-s="zoom" min="0.6" max="2.4" step="0.05"></label>
    <label>Mật độ chữ &amp; sticker<input type="range" data-s="density" min="0.3" max="2" step="0.1"></label>
    <label class="chk"><input type="checkbox" data-s="cycle">Chữ tự đổi màu mỗi 2 giây</label>
    <label>Màu nền<input type="color" data-s="bg"></label>
    <div class="row"><button id="reset">Khôi phục cài đặt mặc định (nền đen)</button></div>
    <div class="row"><button id="exp">Xuất .json</button><label class="btn" for="fJson">Nhập .json</label></div>
  </details>
  <details open><summary>Nhạc MP3</summary>
    <p class="hint" id="ms">Chưa chọn nhạc. Chọn file MP3, hoặc đặt music.mp3 cạnh index.html rồi bấm "Dùng music.mp3".</p>
    <div class="row"><label class="btn" for="fMp3">🎵 Chọn MP3</label><button id="def">Dùng music.mp3</button></div>
    <div class="row"><button id="pp">▶ Phát</button><button id="rp">↺ Phát lại</button><label class="chk"><input type="checkbox" id="loop" checked>Lặp</label></div>
    <label>Tiến trình &nbsp;<span id="tm">0:00 / 0:00</span><input type="range" id="pr" min="0" max="1" step="0.1" value="0"></label>
    <label>Âm lượng<input type="range" id="vol" min="0" max="1" step="0.01" value="0.7"></label>
  </details>
</aside>

<div id="toast" role="status"></div>
<!-- Các ô chọn file (ẩn bằng cách đẩy ra ngoài màn hình, không dùng display:none để iOS/Android vẫn mở được) -->
<input type="file" id="fImg" class="fi" accept="image/*">
<input type="file" id="fStk" class="fi" accept="image/png,image/webp">
<input type="file" id="fRep" class="fi" accept="image/*">
<input type="file" id="fMp3" class="fi" accept="audio/mpeg,audio/mp3,.mp3,audio/*">
<input type="file" id="fJson" class="fi" accept=".json,application/json">

<!-- Thư viện Three.js (bản cố định r128, tải từ cdnjs). Muốn chạy offline: tải file này về, dán nội dung vào thẻ <script> -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(()=>{
/* ===== THÔNG SỐ DỄ CHỈNH — sửa các số bên dưới để đổi mật độ, tốc độ, độ nhạy, zoom... ===== */
const CFG={
  // --- Không gian hình trụ (trục dọc Y cố định) ---
  itemCount:480,         // tổng số chữ/sticker/ảnh (máy tính)
  mobileCount:240,       // tổng số trên điện thoại (màn hình hẹp < 640px)
  density:1,             // hệ số mật độ ban đầu: số lượng thực = itemCount × density
  innerRadius:80,        // bán kính nhỏ nhất (phần tử gần camera nhất)
  cylinderRadius:900,    // bán kính lớn nhất của hình trụ (phần tử xa nhất)
  cylinderHeight:1800,   // chiều cao một vòng tuần hoàn theo trục Y
  // --- Chuyển động dọc từ trên xuống ---
  fallSpeed:42,          // tốc độ rơi cơ bản (đơn vị/giây); mỗi phần tử lệch 60%–140%
  breath:.08,            // độ phập phồng của bán kính (tiến gần / lùi xa rất nhẹ)
  // --- Điều khiển góc nhìn ---
  rotationSpeed:1,       // hệ số tốc độ xoay tự động ban đầu
  autoRotationSpeed:.05, // tốc độ tự xoay quanh trục Y (rad/giây)
  dragSensitivity:.0022, // độ nhạy kéo chuột/vuốt (rad/pixel) — càng nhỏ càng chậm
  rotationDamping:.95,   // quán tính sau khi thả (càng gần 1 càng trôi lâu)
  maxSpin:1.4,           // tốc độ xoay tối đa sau khi thả (rad/giây)
  maxTiltAngle:90,       // tổng phạm vi ngẩng/cúi 180°: pitch từ -90° đến +90°
  restTilt:6,            // góc ban đầu và góc dùng khi bấm đặt lại; không tự kéo pitch về đây
  zoomMin:.6,zoomMax:2.4,// giới hạn zoom gần nhất / xa nhất
  // --- Hoạt ảnh mở đầu & đổi màu chữ ---
  introWaves:6,introMin:2,introMax:5,introHeight:1500,
  colorEvery:2,colorFade:.4
};
const KEY='qc3d_v3',OLD=['qc3d_v2','qc3d_v1'];
const $=s=>document.querySelector(s);
const FONTS=['Quicksand','Be Vietnam Pro','Nunito','Baloo 2','Dancing Script','sans-serif']; // đều hỗ trợ tiếng Việt; có font dự phòng khi offline
// Bảng màu chữ tự đổi: hồng pastel, xanh ngọc, xanh dương nhạt, tím nhạt, trắng (đều sáng, nổi trên nền đen)
const PAL=['#ffb3d1','#ff8fb1','#ffd1e8','#6fe3d2','#9ff0e4','#8ec9ff','#a8f0ff','#b9a8ff','#d9c2ff','#ffffff'];
const defaultS=()=>({speed:CFG.rotationSpeed,fall:1,auto:true,cycle:true,size:1,zoom:1,density:CFG.density,bg:'#000000'});
let S=defaultS(),items=[],sel=null,insts=[];

/* ---------- Tiện ích ---------- */
const uid=()=>Math.random().toString(36).slice(2,8);
const rnd=n=>{const x=Math.sin(n*127.1+311.7)*43758.5453;return x-Math.floor(x)}; // số ngẫu nhiên cố định theo n
const frac=x=>x-Math.floor(x),clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');
const mkC=(w,h)=>{const c=document.createElement('canvas');c.width=w;c.height=h;return c};
const mk=o=>({id:uid(),dist:1,ang:0,w:1,...o}); // w = tần suất xuất hiện
const T=(t,c,s=32)=>mk({type:'text',text:t,font:'Quicksand',weight:400,color:c,shadow:true,cycle:true,size:s});
const defaults=()=>[T('Anh yêu em','#ff8fb1',34),T('Trọn đời','#ffb3d1',38),T('Hạnh phúc','#ffffff',32),T('Mãi bên nhau','#6fe3d2',28),T('Yêu em','#ff8fb1',26),T('Em là tất cả','#8ec9ff',28),T('Mãi yêu','#d9c2ff',26),
  mk({type:'heart',color:'#ff2d3f',size:24,w:1.4}),mk({type:'heart',color:'#ff5a66',size:16,w:1.4})];
let tt;function toast(m){const e=$('#toast');e.textContent=m;e.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>e.classList.remove('on'),3600)}

/* ---------- Lưu / tải (localStorage; ảnh đã thu nhỏ trước khi lưu) ---------- */
const rep=(k,v)=>k[0]==='_'?undefined:v; // bỏ các trường tạm bắt đầu bằng "_"
function save(){try{localStorage.setItem(KEY,JSON.stringify({S,items},rep))}catch(e){toast('Bộ nhớ trình duyệt đầy hoặc bị chặn: nội dung chưa được lưu. Hãy dùng "Xuất .json".')}}
function load(j){
  S={...S,...j.S};items=j.items.map(x=>({dist:1,ang:0,w:1,...x}));
  return Promise.all(items.filter(i=>i.src).map(i=>new Promise(r=>{const m=new Image();m.onload=()=>{i._img=m;r()};m.onerror=r;m.src=i.src}))).then(()=>{items=items.filter(i=>!i.src||i._img)});
}

/* ---------- Three.js: cảnh, camera, ánh sáng ---------- */
const cvs=$('#c'),R=new THREE.WebGLRenderer({canvas:cvs,antialias:true,alpha:true});
R.setPixelRatio(Math.min(window.devicePixelRatio||1,innerWidth<640?1.5:1.75));
const ANI=Math.min(4,R.capabilities.getMaxAnisotropy());
const scene=new THREE.Scene(),cam=new THREE.PerspectiveCamera(70,1,1,6000),group=new THREE.Group();
cam.rotation.order='YXZ'; // xoay quanh Y (yaw) rồi ngẩng/cúi (pitch); KHÔNG BAO GIỜ roll → trục dọc luôn thẳng đứng
scene.add(group);       // group = "thế giới" hình trụ, chỉ được co giãn, không bị xoay
scene.add(new THREE.AmbientLight(0xffffff,.6));
const L1=new THREE.DirectionalLight(0xffffff,.9);L1.position.set(1,1.2,1);scene.add(L1);
const L2=new THREE.DirectionalLight(0x7fe9ff,.5);L2.position.set(-1,-.5,.5);scene.add(L2);

// Sao nền 3D: bốn lớp vỏ cầu thật sự, mỗi lớp dùng một BufferGeometry + Points + shader GPU.
// Khoảng cách, kích thước, độ sáng và hệ số thị sai khác nhau giữa các lớp.
const mobileStars=innerWidth<640;
const starLayerDefs=[
  {name:'near',     count:mobileStars?70:140,   min:430,  max:940,  brightness:.92,  sizeMin:3.0,  sizeMax:9.0,  parallax:44},
  {name:'mid-near', count:mobileStars?210:420,  min:980,  max:1660, brightness:.66,  sizeMin:1.4,  sizeMax:4.0,  parallax:22},
  {name:'mid-far',  count:mobileStars?570:1100, min:1740, max:2920, brightness:.43,  sizeMin:.55, sizeMax:2.0,  parallax:9},
  {name:'far',      count:mobileStars?1250:2400,min:3040, max:4850, brightness:.285, sizeMin:.22, sizeMax:1.25, parallax:3.2}
];
const starsLayers=[];
const starPalette=[
  [1.00,.98,.94], [1.00,.96,.90], [.79,.88,1.00], [.64,.84,1.00],
  [.68,.94,1.00], [.86,.79,1.00], [.94,.90,1.00]
];
function buildStarLayer(def,layerIndex){
  const count=def.count, positions=new Float32Array(count*3), starData=new Float32Array(count*4), colors=new Float32Array(count*4), glowData=new Float32Array(count);
  const min3=def.min*def.min*def.min,max3=def.max*def.max*def.max;
  for(let i=0;i<count;i++){
    // Phân bố theo hướng cầu 3D, không dồn vào mặt phẳng hay một vòng tròn.
    const seed=layerIndex*100000+i*17+1;
    const z=rnd(seed+1)*2-1,az=rnd(seed+2)*Math.PI*2;
    const horizontal=Math.sqrt(Math.max(0,1-z*z));
    const radius=Math.cbrt(def.min**3+rnd(seed+3)*(max3-min3));
    positions.set([Math.cos(az)*horizontal*radius,z*radius,Math.sin(az)*horizontal*radius],i*3);

    const sizeRand=rnd(seed+4),isBright=rnd(seed+5)>.989;
    let size=def.sizeMin+Math.pow(sizeRand, isBright?.7:2.0)*(def.sizeMax-def.sizeMin);
    if(isBright)size*=1.38;
    const phase=rnd(seed+6)*Math.PI*2;
    const speed=rnd(seed+7)<.23?.035+rnd(seed+8)*.095:.18+rnd(seed+9)*.68;
    const rawBrightness=.055+.91*Math.pow(rnd(seed+10),2.5);
    const brightness=Math.min(1,(rawBrightness+(isBright?.2:0))*def.brightness);
    starData.set([size,phase,brightness,speed],i*4);

    const hueRoll=rnd(seed+11),paletteIndex=hueRoll<.78?0:hueRoll<.87?2:hueRoll<.94?4:5;
    const rgb=starPalette[paletteIndex];
    const twinkle=rnd(seed+12)<.18?.035:.18+rnd(seed+13)*.7; // alcune quasi stabili, altre scintillano piano
    colors.set([rgb[0],rgb[1],rgb[2],twinkle],i*4);
    glowData[i]=isBright?1:.0;
  }
  const geometry=new THREE.BufferGeometry();
  geometry.setAttribute('position',new THREE.BufferAttribute(positions,3));
  geometry.setAttribute('aStar',new THREE.BufferAttribute(starData,4)); // dimensione, fase, luminosità, velocità
  geometry.setAttribute('aColor',new THREE.BufferAttribute(colors,4)); // RGB + ampiezza del luccichio
  geometry.setAttribute('aGlow',new THREE.BufferAttribute(glowData,1));
  const material=new THREE.ShaderMaterial({
    transparent:true,depthTest:true,depthWrite:false,blending:THREE.AdditiveBlending,
    uniforms:{uT:{value:0},uPx:{value:500},uYawSin:{value:0},uYawCos:{value:1},uPitchSin:{value:0},uParallax:{value:def.parallax}},
    vertexShader:`
      attribute vec4 aStar; attribute vec4 aColor; attribute float aGlow;
      uniform float uT,uPx,uYawSin,uYawCos,uPitchSin,uParallax;
      varying vec3 vColor; varying float vAlpha; varying float vGlow;
      void main(){
        vec3 p=position;
        // Thị sai bổ sung trơn theo hướng nhìn; cường độ giảm dần rõ rệt theo khoảng cách.
        p.x += uYawSin*uParallax;
        p.z += (uYawCos-1.0)*uParallax*.45;
        p.y += uPitchSin*uParallax*.72;
        vec4 mv=modelViewMatrix*vec4(p,1.0);
        float wave=sin(uT*aStar.w+aStar.y);
        float twinkle=1.0-aColor.a*.28+aColor.a*.28*wave;
        vAlpha=clamp(aStar.z*twinkle,0.0,1.0);
        vColor=aColor.rgb; vGlow=aGlow;
        gl_PointSize=clamp(aStar.x*uPx/max(1.0,-mv.z),.65,22.0);
        gl_Position=projectionMatrix*mv;
      }`,
    fragmentShader:`
      varying vec3 vColor; varying float vAlpha; varying float vGlow;
      void main(){
        float d=length(gl_PointCoord-vec2(.5))*2.0;
        if(d>1.0) discard;
        float core=exp(-d*d*(vGlow>.5?19.0:30.0));
        float halo=exp(-d*d*3.7)*mix(.075,.42,vGlow);
        float alpha=clamp(vAlpha*(core+halo),0.0,1.0);
        gl_FragColor=vec4(vColor,alpha);
      }`
  });
  const points=new THREE.Points(geometry,material);points.frustumCulled=false;scene.add(points);
  starsLayers.push({name:def.name,geometry,material,points,parallax:def.parallax});
}
starLayerDefs.forEach(buildStarLayer);

// Hình trái tim 3D (đùn khối + vát cạnh) dùng chung cho mọi trái tim
const hs=new THREE.Shape();hs.moveTo(0,-.5);
hs.bezierCurveTo(-.15,-.35,-.55,-.1,-.5,.2);hs.bezierCurveTo(-.47,.5,-.08,.55,0,.25);
hs.bezierCurveTo(.08,.55,.47,.5,.5,.2);hs.bezierCurveTo(.55,-.1,.15,-.35,0,-.5);
const HG=new THREE.ExtrudeGeometry(hs,{depth:.25,bevelEnabled:true,bevelThickness:.2,bevelSize:.15,bevelSegments:6,curveSegments:18});
HG.center();HG.scale(.8,.8,.8);
const PG=new THREE.PlaneGeometry(1,1); // tấm phẳng dùng chung cho chữ / ảnh / sticker

/* ---------- Vẽ nội dung ra canvas → texture ---------- */
function render(it){
  if(it.type==='text'){
    const f=`${it.weight||400} 96px "${it.font}",system-ui,"Segoe UI",Roboto,Arial,sans-serif`,lines=(it.text||' ').split('\n'),m=mkC(1,1).getContext('2d'),P=70;
    m.font=f;const w=Math.ceil(Math.max(...lines.map(l=>m.measureText(l).width))+P*2),lh=120,c=mkC(w,lh*lines.length+P),x=c.getContext('2d');
    x.font=f;x.textAlign='center';x.textBaseline='middle';x.fillStyle='#fff';x.shadowColor='#fff';
    lines.forEach((l,i)=>{const cy=P/2+lh*(i+.5);
      if(it.shadow){x.shadowBlur=36;x.fillText(l,w/2,cy);x.shadowBlur=12;x.fillText(l,w/2,cy)} // viền sáng kiểu neon (màu thật áp bằng material.color)
      x.shadowBlur=0;x.fillText(l,w/2,cy)});
    return c;
  }
  if(it.emoji){const c=mkC(200,200),x=c.getContext('2d');x.font='150px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';x.textAlign='center';x.textBaseline='middle';x.fillText(it.emoji,100,108);return c}
  const im=it._img,w=im.width,h=im.height,c=mkC(w,h),x=c.getContext('2d');
  const r=it.type==='image'?(it.round||0)/100*Math.min(w,h):0; // bo góc theo % cạnh ngắn
  x.beginPath();x.moveTo(r,0);x.arcTo(w,0,w,h,r);x.arcTo(w,h,0,h,r);x.arcTo(0,h,0,0,r);x.arcTo(0,0,w,0,r);x.closePath();x.clip();
  x.drawImage(im,0,0);return c; // giữ nguyên tỷ lệ gốc, không méo
}
function tex(it){if(it._t)return;const c=render(it),t=new THREE.CanvasTexture(c); // chỉ tạo texture khi ảnh/chữ đã sẵn sàng
  t.anisotropy=ANI;it._t=t;it._ar=c.width/c.height}
function disposeItem(it){if(it._t){it._t.dispose();it._t=null}if(it._hm){it._hm.dispose();it._hm=null}}

/* ---------- Trạng thái chuyển động: 3 nhóm tách biệt ----------
   1) Nội dung: tọa độ hình trụ (góc θ quanh trục Y, bán kính r, độ cao y) — y giảm đều theo fallT, hết vòng thì quay lại đỉnh.
   2) Camera: yaw (quanh trục Y) + pitch giới hạn, KHÔNG roll — chịu tác động của kéo chuột / tự xoay.
   3) Zoom: cam.zoom, ease về zoomT. */
let t=0,cc=0,fallT=0,introT=0,introOn=false,yaw=0,pitch=CFG.restTilt*Math.PI/180,vyaw=0,drag=false,zoomT=1,last=performance.now();
const PITCH_LIMIT=Math.min(Math.PI/2,CFG.maxTiltAngle*Math.PI/180),POLE_EPSILON=.00025;
const AXIS_Y=new THREE.Vector3(0,1,0),AXIS_X=new THREE.Vector3(1,0,0),qYaw=new THREE.Quaternion(),qPitch=new THREE.Quaternion();
const CS=[],ease=p=>p*p*(3-2*p),clamp01=v=>clamp(v,0,1); // CS: trạng thái màu theo slot, giữ khi dựng lại
function plan(N){ // phân N slot cho các phần tử theo tần suất w, xen kẽ loại (chữ, tim, ảnh...)
  const cnt=items.map(()=>0),out=[];
  for(let i=0;i<N;i++){let b=0,bv=1e9;items.forEach((it,k)=>{const v=(cnt[k]+.5)/(it.w||1);if(v<bv){bv=v;b=k}});cnt[b]++;out.push(items[b])}
  return out;
}
function build(){ // chỉ chạy khi nội dung/mật độ đổi — KHÔNG chạy mỗi khung hình hay mỗi lần phần tử đi hết hành trình
  const prevN=insts.length;
  insts.forEach(i=>{group.remove(i.o);if(i.mat)i.mat.dispose()});insts=[];
  if(!items.length)return;
  const N=Math.max(1,Math.round((innerWidth<640?CFG.mobileCount:CFG.itemCount)*S.density)),IN2=CFG.innerRadius**2,OUT2=CFG.cylinderRadius**2,H=CFG.cylinderHeight;
  plan(N).forEach((it,i)=>{
    const txt=it.type==='text',heart=it.type==='heart';let o,mat=null;
    if(heart){
      it._hm=it._hm||new THREE.MeshPhongMaterial({color:it.color,specular:0xffffff,shininess:110,emissive:new THREE.Color(it.color).multiplyScalar(.18)});
      o=new THREE.Mesh(HG,it._hm);
    }else{tex(it);mat=new THREE.MeshBasicMaterial({map:it._t,transparent:true,depthWrite:false,side:THREE.DoubleSide,color:txt?it.color:0xffffff});o=new THREE.Mesh(PG,mat)}
    // Tọa độ hình trụ ổn định theo chỉ số i (dãy R2 phủ đều góc × độ cao; bán kính lấy theo diện tích → nhiều phần tử xa nhỏ, ít phần tử gần lớn)
    let th=6.28319*frac(i*.7548776662)+it.ang*Math.PI/180,r=Math.sqrt(IN2+(OUT2-IN2)*rnd(i*3+1))*it.dist,v=.6+rnd(i*5+3)*.8,y0=(frac(i*.5698402910)-.5)*H,born=(!introOn&&prevN&&i>=prevN)?cc:-1;
    if(it._focus){ // phần tử mới thêm: đặt ngay trước mặt camera (độ cao hiện tại) để dễ thấy, rồi rơi như các phần tử khác
      th=Math.atan2(-Math.cos(yaw),-Math.sin(yaw));r=230;v=.5;const focusPitch=clamp(pitch,-1.25,1.25),focusY=clamp(r*Math.tan(focusPitch)+40,-H*.44,H*.44);y0=focusY+fallT*v;born=cc;it._focus=false;
    }
    const phi=Math.atan2(-Math.cos(th),-Math.sin(th)); // mặt phẳng hướng vào trục hình trụ (đọc được từ bên trong)
    o.rotation.order='YXZ';
    const c=CS[i]||(CS[i]={cf:new THREE.Color(it.color),ct:new THREE.Color(it.color),cs:-9,cn:cc+rnd(i*17+8)*CFG.colorEvery});
    group.add(o);
    insts.push({o,it,mat,txt,heart,cx:Math.cos(th),sz:Math.sin(th),r,y0,v,c,col:null,born,noFall:born>=0,ph:rnd(i*3+2)*6.28,sf:.8+rnd(i*5+4)*.5,
      rx:(rnd(i*3+5)-.5)*.3,ry:phi+(rnd(i*3+6)-.5)*.5,rz:(rnd(i*3+7)-.5)*.26,
      delay:Math.floor(rnd(i*7+4)*CFG.introWaves)*.55+rnd(i*11+5)*.5,dur:CFG.introMin+rnd(i*13+6)*(CFG.introMax-CFG.introMin)});
  });
}
function refresh(it){const go=()=>{disposeItem(it);build();list();save()};
  it.type==='text'&&document.fonts?document.fonts.load(`${it.weight||400} 40px "${it.font}"`,it.text).then(go,go):go()}

/* ---------- Vòng lặp hoạt ảnh DUY NHẤT ---------- */
function tick(now){
  requestAnimationFrame(tick);
  const dt=Math.min(.05,(now-last)/1000);last=now;cc+=dt; // cc: đồng hồ thật (đổi màu, lấp lánh)
  const run=S.auto?dt:0;t+=run;fallT+=run*CFG.fallSpeed*S.fall; // chuyển động dọc chạy độc lập với kéo chuột
  if(introOn){introT+=dt;if(introT>CFG.introWaves*.55+.5+CFG.introMax+.3)introOn=false}
  // --- Camera: yaw không giới hạn số vòng; pitch đủ 180° nhưng tránh kỳ dị Euler ngay tại hai cực.
  // Pitch logic vẫn chạm chính xác ±90°. Quaternion dùng góc sát cực hơn 0.015° để tránh lật/nhảy trục.
  if(!drag){yaw+=vyaw*dt;vyaw*=Math.pow(CFG.rotationDamping,dt*60)} // không tự đưa pitch về góc nghỉ sau khi thả
  yaw+=run*CFG.autoRotationSpeed*S.speed;
  pitch=clamp(pitch,-PITCH_LIMIT,PITCH_LIMIT);
  const visualPitch=clamp(pitch,-PITCH_LIMIT+POLE_EPSILON,PITCH_LIMIT-POLE_EPSILON);
  qYaw.setFromAxisAngle(AXIS_Y,yaw);qPitch.setFromAxisAngle(AXIS_X,visualPitch);
  cam.quaternion.copy(qYaw).multiply(qPitch); // tương đương thứ tự YXZ, ổn định hơn Euler ở ±90°
  cam.position.set(Math.sin(t*.11)*30,Math.sin(t*.07)*20,Math.cos(t*.09)*30); // camera trôi nhẹ trong lòng hình trụ
  if(Math.abs(zoomT-S.zoom)>.0005){S.zoom+=(zoomT-S.zoom)*(1-Math.exp(-dt*10));cam.zoom=S.zoom;cam.updateProjectionMatrix()} // zoom mượt
  group.scale.setScalar(S.size);
  const focalPx=R.domElement.height/(2*Math.tan(cam.fov*Math.PI/360))*cam.zoom;
  for(const layer of starsLayers){
    const u=layer.material.uniforms;u.uT.value=cc;u.uPx.value=focalPx;
    u.uYawSin.value=Math.sin(yaw);u.uYawCos.value=Math.cos(yaw);u.uPitchSin.value=Math.sin(pitch);
  }
  // --- Nội dung ---
  const H=CFG.cylinderHeight,hh=H/2;
  for(const i of insts){
    const it=i.it,o=i.o,rr=i.r*(1+CFG.breath*Math.sin(t*.25+i.ph));
    let y=((i.y0-fallT*i.v+hh)%H+H)%H-hh; // đi xuống đều; vượt đáy thì quay lại đỉnh
    let vis=1-ease(clamp01((Math.abs(y)/hh-.78)/.22)),rem=0; // mờ dần ở hai đầu → khi quay lại đỉnh không thấy cú nhảy
    if(introOn&&!i.noFall){rem=1-ease(clamp01((introT-i.delay)/i.dur));y+=CFG.introHeight*rem;vis*=1-ease(clamp01((rem-.8)/.2))} // hoạt ảnh mở đầu
    if(vis<.004){o.visible=false;continue}
    o.visible=true;o.position.set(i.cx*rr,y,i.sz*rr);
    let pop=1;if(i.born>=0){const p=clamp01((cc-i.born)/.7);if(p>=1)i.born=-1;else{const q=p-1;pop=1+2.70158*q*q*q+1.70158*q*q}}
    const s=it.size*i.sf*pop,wob=Math.sin(introT*2.1+i.ph)*.4*rem;
    if(i.mat){ // chữ / ảnh / sticker
      o.scale.set(s*(it._ar||1),s,1);i.mat.opacity=vis;o.rotation.set(i.rx,i.ry,i.rz+wob);
      if(i.txt){ // đổi màu: mỗi dòng có lịch riêng, chuyển mượt trong colorFade giây
        const c=i.c;
        if(S.cycle&&it.cycle!==false){
          i.col=null;
          if(cc>=c.cn){c.cf.copy(i.mat.color);c.ct.set(PAL[(Math.random()*PAL.length)|0]);c.cs=cc;c.cn=Math.max(c.cn+CFG.colorEvery,cc+.5)}
          i.mat.color.copy(c.cf).lerp(c.ct,clamp01((cc-c.cs)/CFG.colorFade));
        }else if(i.col!==it.color){i.col=it.color;i.mat.color.set(it.color);c.cf.set(it.color);c.ct.set(it.color)}
      }
    }else{ // trái tim 3D: tự xoay quanh chính nó
      o.scale.setScalar(s*vis);o.rotation.set(Math.sin(t*.8+i.ph)*.35,i.ph+t*(.7+i.ph*.1),i.rz+wob);
    }
  }
  R.render(scene,cam);
}

/* ---------- Điều khiển bằng Pointer Events (chuột, bút, cảm ứng): 1 điểm = xoay quanh trục Y, 2 ngón = zoom ---------- */
const ptrs=new Map();let pinch0=0,zoom0=1,lastT=0,zs;
const pdist=()=>{const a=[...ptrs.values()];return Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y)};
function syncZoom(){const z=$('[data-s="zoom"]');if(z)z.value=zoomT;clearTimeout(zs);zs=setTimeout(()=>{S.zoom=zoomT;save()},700)}
cvs.addEventListener('pointerdown',e=>{
  try{cvs.setPointerCapture(e.pointerId)}catch(_){}
  ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(ptrs.size===1){drag=true;vyaw=0;lastT=e.timeStamp}
  else if(ptrs.size===2){drag=false;pinch0=pdist();zoom0=zoomT} // hai ngón: chuyển sang zoom, tắt xoay
});
cvs.addEventListener('pointermove',e=>{
  const p=ptrs.get(e.pointerId);if(!p)return;
  const dx=e.clientX-p.x,dy=e.clientY-p.y;p.x=e.clientX;p.y=e.clientY;
  if(ptrs.size===2){if(pinch0>0){zoomT=clamp(zoom0*pdist()/pinch0,CFG.zoomMin,CFG.zoomMax);syncZoom()}return}
  if(ptrs.size!==1||!drag)return;
  const k=CFG.dragSensitivity/S.zoom; // zoom càng gần càng xoay chậm
  yaw+=dx*k;pitch=clamp(pitch+dy*k,-PITCH_LIMIT,PITCH_LIMIT);
  const dtm=Math.max(.008,(e.timeStamp-lastT)/1000);lastT=e.timeStamp;
  vyaw=clamp(vyaw*.5+(dx*k/dtm)*.5,-CFG.maxSpin,CFG.maxSpin); // vận tốc để tạo quán tính sau khi thả
});
const endP=e=>{ptrs.delete(e.pointerId);drag=false;if(ptrs.size<2)pinch0=0}; // sau khi chụm, ngón còn lại không tự kích hoạt xoay
cvs.addEventListener('pointerup',endP);cvs.addEventListener('pointercancel',endP);
cvs.addEventListener('wheel',e=>{e.preventDefault();zoomT=clamp(zoomT*(e.deltaY>0?.92:1.08),CFG.zoomMin,CFG.zoomMax);syncZoom()},{passive:false});
function rs(){const w=innerWidth,h=innerHeight,dpr=Math.min(window.devicePixelRatio||1,w<640?1.5:1.75);if(R.getPixelRatio()!==dpr)R.setPixelRatio(dpr);R.setSize(w,h,false);cam.aspect=w/h;cam.fov=w<h?88:70;cam.updateProjectionMatrix()}
addEventListener('resize',rs);

/* ---------- Cài đặt cảnh ---------- */
function applyS(){
  cam.zoom=S.zoom;cam.updateProjectionMatrix();
  document.body.style.background=S.bg; // nền đặc, mặc định đen
  scene.fog=new THREE.FogExp2(S.bg,.0013); // xa thì mờ dần về màu nền
  document.querySelectorAll('[data-s]').forEach(i=>{const v=S[i.dataset.s];if(i.type==='checkbox')i.checked=!!v;else i.value=v});

}
$('#scene').oninput=e=>{const el=e.target,k=el.dataset.s;if(!k)return;S[k]=el.type==='checkbox'?el.checked:el.type==='range'?+el.value:el.value;if(k==='zoom')zoomT=S.zoom;applyS();if(k==='density')build();save()};
$('#reset').onclick=()=>{S={...defaultS()};zoomT=1;applyS();build();save();toast('Đã khôi phục cài đặt mặc định (nền đen).')};

$('#rst').onclick=()=>{yaw=0;pitch=CFG.restTilt*Math.PI/180;vyaw=0}; // đặt lại góc xoay (pitch không tự trở về đây khi thả chuột)
$('#fs').onclick=()=>{const d=document.documentElement;document.fullscreenElement?document.exitFullscreen():d.requestFullscreen?d.requestFullscreen():toast('Trình duyệt này không hỗ trợ toàn màn hình.')};

addEventListener('keydown',e=>{if(e.key==='Escape')document.body.classList.remove('pv')});

/* ---------- Chọn file: dùng <label for> + <input type=file> có sẵn trong HTML, gắn sự kiện "change" đúng MỘT lần ---------- */
const onFile=(id,fn)=>$(id).addEventListener('change',e=>{const f=e.target.files&&e.target.files[0];if(f)fn(f);e.target.value=''}); // reset để chọn lại cùng file vẫn kích hoạt
const EXT={image:['jpg','jpeg','png','webp'],sticker:['png','webp']};
function readImg(f,kind,cb){
  const ext=(f.name.split('.').pop()||'').toLowerCase();
  const okType=kind==='sticker'?/^image\/(png|webp)$/.test(f.type):/^image\/(jpeg|png|webp)$/.test(f.type);
  if(!okType&&!(!f.type&&EXT[kind].includes(ext)))
    return toast(kind==='sticker'?'Sticker chỉ hỗ trợ PNG hoặc WebP (nền trong suốt). File bạn chọn: '+(f.type||ext||'không rõ')+'.':'Ảnh chỉ hỗ trợ JPG, JPEG, PNG hoặc WebP. File bạn chọn: '+(f.type||ext||'không rõ')+'.');
  const u=URL.createObjectURL(f),im=new Image();
  im.onerror=()=>{URL.revokeObjectURL(u);toast('Không đọc được ảnh "'+f.name+'". File có thể bị hỏng.')};
  im.onload=()=>{ // ảnh đã tải xong → thu nhỏ (giữ đúng tỷ lệ) → mới tạo đối tượng 3D
    try{
      const m=kind==='sticker'?320:512,s=Math.min(1,m/Math.max(im.naturalWidth,im.naturalHeight)),c=mkC(Math.max(1,Math.round(im.naturalWidth*s)),Math.max(1,Math.round(im.naturalHeight*s)));
      c.getContext('2d').drawImage(im,0,0,c.width,c.height);
      cb(c.toDataURL(kind==='sticker'?'image/png':'image/webp',.82),c);
    }catch(e){toast('Không xử lý được ảnh: '+e.message)}
    finally{URL.revokeObjectURL(u)} // giải phóng URL tạm
  };
  im.src=u;
}
function add(o){const it=mk(o);it._focus=true;items.push(it);sel=it.id;build();list();editor();save();toast('Đã thêm vào không gian 3D (đang hiện phía trước bạn).')}
onFile('#fImg',f=>readImg(f,'image',(src,c)=>add({type:'image',src,_img:c,size:60,round:14,w:.6})));
onFile('#fStk',f=>readImg(f,'sticker',(src,c)=>add({type:'sticker',src,_img:c,size:36})));
onFile('#fRep',f=>{const it=cur();if(it&&it.src)readImg(f,it.type,(src,c)=>{it.src=src;it._img=c;refresh(it);toast('Đã thay ảnh.')})});
$('#aTxt').onclick=()=>add(T('Nội dung mới','#ffffff'));
$('#aHrt').onclick=()=>add({type:'heart',color:'#ff2d3f',size:24,w:1.4});
$('#aEmo').onclick=()=>{const v=$('#emo').value.trim();if(!v)return toast('Hãy nhập hoặc dán một emoji.');add({type:'sticker',emoji:v,size:34});$('#emo').value=''};

/* ---------- Danh sách & bảng chỉnh sửa ---------- */
const cur=()=>items.find(x=>x.id===sel);
const lab=it=>it.type==='text'?it.text.replace(/\n/g,' ').slice(0,22):it.type==='image'?'🖼 Ảnh':it.type==='heart'?'💗 Trái tim 3D':(it.emoji||'🏷 Sticker');
function list(){$('#list').innerHTML=items.map(it=>`<li data-id="${it.id}" class="${it.id===sel?'on':''}"><span>${esc(lab(it))}</span><button data-a="e" title="Chỉnh sửa">✎</button><button data-a="d" title="Xóa">✕</button></li>`).join('')||'<li class="hint">Chưa có phần tử nào. Hãy thêm ở trên.</li>'}
$('#list').onclick=e=>{
  const li=e.target.closest('li[data-id]');if(!li)return;const id=li.dataset.id;
  if(e.target.dataset.a==='d'){const it=items.find(x=>x.id===id);disposeItem(it);items=items.filter(x=>x!==it);if(sel===id)sel=null;build()}else sel=id;
  list();editor();save();
};
const rg=(k,l,a,b,s,v)=>`<label>${l}<input type="range" data-k="${k}" min="${a}" max="${b}" step="${s}" value="${v}"></label>`;
function editor(){
  const it=cur(),e=$('#ed');
  if(!it){e.innerHTML='<p class="hint">Chọn một phần tử trong danh sách để chỉnh sửa.</p>';return}
  let h='';
  if(it.type==='text')h+=`<label>Nội dung (Enter để xuống dòng)<textarea data-k="text" rows="2">${esc(it.text)}</textarea></label>
   <label>Font<select data-k="font">${FONTS.map(f=>`<option ${f===it.font?'selected':''}>${f}</option>`).join('')}</select></label>
   <div class="row"><label>Màu gốc<input type="color" data-k="color" value="${it.color}"></label><label class="chk"><input type="checkbox" data-k="cycle" ${it.cycle!==false?'checked':''}>Tự đổi màu</label></div>
   <div class="row"><label>Độ đậm<select data-k="weight">${[[300,'Mảnh'],[400,'Thường'],[500,'Vừa'],[700,'Đậm']].map(([w,n])=>`<option value="${w}" ${+(it.weight||400)===w?'selected':''}>${n}</option>`).join('')}</select></label><label class="chk"><input type="checkbox" data-k="shadow" ${it.shadow?'checked':''}>Phát sáng</label></div>`;
  if(it.type==='heart')h+=`<label>Màu<input type="color" data-k="color" value="${it.color}"></label>`;
  if(it.emoji)h+=`<label>Emoji<input type="text" data-k="emoji" value="${esc(it.emoji)}"></label>`;
  if(it.type==='image')h+=rg('round','Bo góc',0,50,1,it.round||0);
  h+=rg('size','Kích thước',6,160,1,it.size)+rg('w','Tần suất xuất hiện',.2,3,.1,it.w||1)+rg('dist','Độ xa / gần',.3,1.6,.05,it.dist)+rg('ang','Vị trí (xoay quanh tâm)',0,360,5,it.ang);
  if(it.src)h+='<label class="btn" for="fRep">Thay ảnh khác</label>';
  e.innerHTML=h;
}
$('#ed').oninput=e=>{ // chỉ sửa DUY NHẤT phần tử đang chọn
  const el=e.target,k=el.dataset.k,it=cur();if(!k||!it)return;
  it[k]=el.type==='checkbox'?el.checked:el.type==='range'?+el.value:el.value;
  if(k==='color'&&it.type==='text'){it.cycle=false;const c=$('#ed [data-k="cycle"]');if(c)c.checked=false} // chọn màu tay thì tắt tự đổi màu cho dòng này
  if(k==='color'&&it._hm){it._hm.color.set(it.color);it._hm.emissive.set(it.color).multiplyScalar(.18)}
  if(k==='size'||k==='color'||k==='cycle')return save(); // vòng lặp tự cập nhật, không cần dựng lại
  if(k==='w'||k==='dist'||k==='ang'){build();return save()}
  refresh(it);
};

/* ---------- Xuất / nhập .json ---------- */
$('#exp').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify({S,items},rep)],{type:'application/json'}));a.download='qua-cau-3d.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1e3)};
onFile('#fJson',f=>f.text().then(x=>{const j=JSON.parse(x);if(!Array.isArray(j.items))throw 0;items.forEach(disposeItem);return load(j).then(()=>{sel=null;boot()})}).catch(()=>toast('File .json không hợp lệ.')));
$('#intro').onclick=()=>{insts.forEach(i=>{i.noFall=false;i.born=-1});introT=0;introOn=true}; // phát lại hoạt ảnh rơi

/* ---------- Nhạc MP3: chỉ phát khi người dùng bấm nút ---------- */
const au=new Audio(),ms=$('#ms'),pr=$('#pr'),tm=$('#tm');let blob=null,nm='',seek=false,useDef=false;
au.preload='auto';au.loop=true;au.volume=.7;
const fmt=s=>isFinite(s)?Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0'):'0:00';
const tmUi=()=>{tm.textContent=fmt(au.currentTime)+' / '+fmt(au.duration)};
function sync(){const p=!au.paused&&!au.ended;$('#pp').textContent=p?'⏸ Tạm dừng':'▶ Phát';$('#bpp').style.background=p?'rgba(255,143,177,.45)':''}
function setSrc(url,name,isBlob){ // gán nguồn nhạc mới; giải phóng URL tạm của bài trước
  if(blob){URL.revokeObjectURL(blob);blob=null}
  if(isBlob)blob=url;
  nm=name;au.src=url;au.load();pr.value=0;pr.max=1;ms.textContent='Đang tải '+name+'…';tmUi();sync();
}
au.addEventListener('loadedmetadata',()=>{pr.max=au.duration||1;ms.textContent=nm+' — sẵn sàng, bấm Phát.';tmUi()});
au.addEventListener('timeupdate',()=>{if(!seek)pr.value=au.currentTime;tmUi()});
au.addEventListener('play',sync);au.addEventListener('pause',sync);
au.addEventListener('ended',()=>{sync();ms.textContent=nm+' — đã phát xong, bấm Phát lại.'});
au.addEventListener('error',()=>{
  const c=au.error&&au.error.code;
  const m=c===4?(useDef&&!blob?'Chưa có file music.mp3 cạnh index.html. Hãy đặt file vào cùng thư mục hoặc bấm "Chọn MP3".':'Trình duyệt không hỗ trợ định dạng này hoặc file không phải nhạc hợp lệ.'):c===3?'File nhạc bị hỏng hoặc không giải mã được.':c===2?'Lỗi mạng khi tải nhạc.':'Việc tải nhạc đã bị hủy.';
  ms.textContent=m;toast(m);sync();
});
function play(){
  if(!au.src||(au.error&&!blob)){useDef=true;setSrc('music.mp3','music.mp3',false)} // chưa chọn gì → thử music.mp3 (an toàn nếu không có file)
  else if(au.error)return toast(ms.textContent);
  const p=au.play();
  if(p&&p.catch)p.catch(err=>{if(err.name==='NotAllowedError')toast('Trình duyệt đang chặn phát tiếng. Hãy bấm Phát lại một lần nữa.');else if(err.name!=='AbortError'&&err.name!=='NotSupportedError')toast('Không phát được nhạc: '+err.message)});
}
$('#pp').onclick=$('#bpp').onclick=()=>au.src&&!au.paused&&!au.ended?au.pause():play();
$('#rp').onclick=()=>{if(au.src&&!au.error)au.currentTime=0;play()};
$('#def').onclick=()=>{useDef=true;setSrc('music.mp3','music.mp3',false)};
$('#loop').onchange=e=>{au.loop=e.target.checked};
$('#vol').oninput=e=>{au.volume=+e.target.value};
pr.addEventListener('input',()=>{if(isFinite(au.duration))au.currentTime=+pr.value});
pr.addEventListener('pointerdown',()=>seek=true);['pointerup','pointercancel','change'].forEach(ev=>pr.addEventListener(ev,()=>seek=false));
onFile('#fMp3',f=>{
  const ext=(f.name.split('.').pop()||'').toLowerCase();
  if(!/^audio\//.test(f.type)&&ext!=='mp3')return toast('File "'+f.name+'" không phải file nhạc. Hãy chọn file .mp3.');
  useDef=false;setSrc(URL.createObjectURL(f),f.name,true);toast('Đã chọn "'+f.name+'". Bấm Phát để nghe.'); // không tự phát
});

/* ---------- Khởi động ---------- */
function boot(){S.zoom=zoomT=clamp(+S.zoom||1,CFG.zoomMin,CFG.zoomMax);build();list();editor();applyS();save()}
(async()=>{
  let j,mig=0;try{j=JSON.parse(localStorage.getItem(KEY));if(!j)for(const k of OLD){const o=JSON.parse(localStorage.getItem(k));if(o){j=o;mig=1;break}}}catch(e){}
  if(j&&Array.isArray(j.items)){
    if(mig){ // dữ liệu bản cũ: giữ nội dung, áp mặc định mới (nền đen, chữ mảnh, tim đỏ, mật độ mới)
      j.S=j.S||{};delete j.S.density;delete j.S.size;j.S.bg='#000000';
      j.items.forEach(it=>{
        if(it.type==='text'&&!it.weight){it.weight=400;if(!FONTS.includes(it.font)||it.font==='Baloo 2')it.font='Quicksand'}
        if(it.type==='heart')it.color={'#ff7aa5':'#ff2d3f','#ff9ec0':'#ff5a66'}[it.color]||it.color;
      });
    }
    await load(j);
  }else{items=defaults();S.auto=!matchMedia('(prefers-reduced-motion:reduce)').matches}
  S.density=clamp(+S.density||1,.3,2);
  if(innerWidth<640)document.body.classList.add('closed');
  // chờ font (tối đa 1,5 giây); nếu offline thì dùng font dự phòng, trang vẫn chạy bình thường
  const fl=document.fonts?Promise.all(FONTS.slice(0,4).map(f=>document.fonts.load(`400 40px "${f}"`,'Aạếữ'))).catch(()=>{}):Promise.resolve();
  await Promise.race([fl,new Promise(r=>setTimeout(r,1500))]);
  rs();boot();introT=0;introOn=true;
  requestAnimationFrame(tick); // vòng lặp hoạt ảnh chỉ được khởi động đúng một lần
  fl.then(()=>{items.forEach(disposeItem);build()});
})();

})();
</script>
